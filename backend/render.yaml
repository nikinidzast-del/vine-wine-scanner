services:
  - type: web
    name: vino-scanner-api
    env: node
    buildCommand: npm install && npx prisma generate && npx prisma db push
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vino-db
          property: connectionString
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: PORT
        value: "10000"
      - key: NODE_VERSION
        value: "20"
      - key: CORS_ORIGIN
        value: "*"

databases:
  - name: vino-db
    plan: free
    databaseName: vino
